sonar.projectKey=visus:notion-sdk-ts
sonar.organization=visus

sonar.projectBaseDir=.

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=**/*.test.ts

# Test-only helpers (mocks, fixtures) are excluded from vitest's coverage
# instrumentation (see vitest.config.ts), so they never appear in lcov.info.
# Exclude them from Sonar's coverage requirement too, or they score 0%.
sonar.coverage.exclusions=src/testUtils/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info